<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IV-Generous Reunion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root {
  --primary: #ffcc00;
  --secondary: #ff7a00;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #000000 80%);
  color: #fff;
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,1)),
              url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819');
  background-size: cover;
  background-position: center;
}

.hero-content {
  max-width: 900px;
}

h1 {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 800;
  color: var(--primary);
  letter-spacing: 2px;
  margin-bottom: 1rem;
}

h2 {
  font-size: 1.5rem;
  opacity: 0.9;
  margin-bottom: 2rem;
}

.description {
  opacity: 0.7;
  margin-bottom: 2rem;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin: 2rem 0;
  flex-wrap: wrap;
}

.time-box {
  background: #111;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 1rem;
  min-width: 100px;
}

.time-box span {
  color: var(--primary);
  font-size: 2rem;
  display: block;
}

.event-details {
  background: linear-gradient(145deg, #111, #1c1c1c);
  border-left: 4px solid var(--primary);
  border-radius: 16px;
  padding: 2rem;
  margin-top: 2rem;
}

.ticket {
  border: 2px dashed var(--primary);
  padding: 1.5rem;
  border-radius: 12px;
  margin-top: 1rem;
}

.map-container {
  margin: 3rem auto;
  max-width: 900px;
  border: 2px solid rgba(255,204,0,0.2);
  border-radius: 16px;
  overflow: hidden;
}

iframe {
  width: 100%;
  height: 400px;
  border: none;
}

.rsvp-section {
  max-width: 500px;
  margin: 3rem auto;
  padding: 2rem;
  background: #111;
  border-radius: 16px;
}

input {
  width: 100%;
  padding: 1rem;
  margin-bottom: 1rem;
  border-radius: 10px;
  border: none;
}

button {
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #000;
  font-weight: 700;
  padding: 1rem;
  border-radius: 50px;
  border: none;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255,204,0,0.6);
}

.attendee {
  padding: 0.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">
    <h1>IV-GENEROUS</h1>
    <h2>20 YEAR CLASS REUNION</h2>

    <p class="description">
      Celebrate 20 years of memories, friendship, and milestones.
    </p>

    <div class="countdown">
      <div class="time-box"><span id="days"></span>Days</div>
      <div class="time-box"><span id="hours"></span>Hours</div>
      <div class="time-box"><span id="minutes"></span>Minutes</div>
      <div class="time-box"><span id="seconds"></span>Seconds</div>
    </div>

    <div class="event-details">
      <h3>MAY 16, 2026 | 3:00 PM</h3>
      <p>Nina's Restaurant</p>
      <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3855.753328360998!2d120.8966104758589!3d14.895065385626948!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397ab34545be33b%3A0x290be937fcaae859!2sNina&#39;s%20Fried%20Itik%20And%20Restaurant!5e0!3m2!1sen!2sph!4v1776230462633!5m2!1sen!2sph" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <!-- <div class="ticket">
        <h3>GENERAL ADMISSION</h3>
        <p>₱500</p>
      </div> -->
    </div>
    <div class="rsvp-section">
        <h2>Are you coming? We’d love to see you! Let us know</h2>
        <!-- <p style="opacity:0.7; margin-bottom:1rem;">Limited seats available.</p> -->
      
        <input type="text" id="name" placeholder="Enter your full name">
        <button onclick="addAttendee()">Confirm</button>
      
        <h3 style="margin-top:1rem;">Attendees:</h3>
        <div id="attendeeList"></div>
      </div>
  </div>
</section>

<!-- <div class="map-container">
  <iframe src="https://www.google.com/maps?q=Nina's+Restaurant&output=embed"></iframe>
</div> -->

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA9Z3TmvbviXlqF4bq5HTezi-vyio9XM-o",
  authDomain: "rsvp-web-app-ivgen.firebaseapp.com",
  databaseURL: "https://rsvp-web-app-ivgen-default-rtdb.asia-southeast1.firebasedatabase.app/",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("attendees");

function addAttendee(){
  const name = document.getElementById('name').value.trim();
  if(!name) return;
  db.push({name});
  document.getElementById('name').value="";
}

db.on("value", snapshot=>{
  const list=document.getElementById('attendeeList');
  list.innerHTML="";
  snapshot.forEach(child=>{
    const div=document.createElement('div');
    div.className="attendee";
    div.textContent=child.val().name;
    list.appendChild(div);
  });
});

const eventDate=new Date("May 16, 2026 15:00:00").getTime();
setInterval(()=>{
  const d=eventDate-new Date().getTime();
  document.getElementById('days').innerText=Math.floor(d/(1000*60*60*24));
  document.getElementById('hours').innerText=Math.floor((d%(1000*60*60*24))/(1000*60*60));
  document.getElementById('minutes').innerText=Math.floor((d%(1000*60*60))/(1000*60));
  document.getElementById('seconds').innerText=Math.floor((d%(1000*60))/1000);
},1000);
</script>

</body>
</html>
