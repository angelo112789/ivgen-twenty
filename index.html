<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IV-Generous Reunion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<style>
:root {
  --primary: #ffcc00;
  --secondary: #ff7a00;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #000000 80%);
  color: #fff;
}

a {
  color: yellow;
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,1)),
              url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819');
  background-size: cover;
  background-position: center;
}

.hero-content {
  max-width: 900px;
}

h1 {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 800;
  color: var(--primary);
  letter-spacing: 2px;
  margin-bottom: 1rem;
}

h2 {
  font-size: 1.5rem;
  opacity: 0.9;
  margin-bottom: 2rem;
}

.description {
  opacity: 0.7;
  margin-bottom: 2rem;
}

.link {
  opacity: 0.7;
  margin-bottom: 2rem;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin: 2rem 0;
  flex-wrap: wrap;
}

.time-box {
  background: #111;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 1rem;
  min-width: 100px;
}

.time-box span {
  color: var(--primary);
  font-size: 2rem;
  display: block;
}

.event-details {
  background: linear-gradient(145deg, #111, #1c1c1c);
  border-left: 4px solid var(--primary);
  border-radius: 16px;
  padding: 2rem;
  margin-top: 2rem;
}

.ticket {
  border: 2px dashed var(--primary);
  padding: 1.5rem;
  border-radius: 12px;
  margin-top: 1rem;
}

.map-container {
  margin: 3rem auto;
  max-width: 900px;
  border: 2px solid rgba(255,204,0,0.2);
  border-radius: 16px;
  overflow: hidden;
}

iframe {
  width: 100%;
  height: 400px;
  border: none;
}

.rsvp-section {
  max-width: 500px;
  margin: 3rem auto;
  padding: 2rem;
  background: #111;
  border-radius: 16px;
}

input {
  width: 100%;
  padding: 1rem;
  margin-bottom: 1rem;
  border-radius: 10px;
  border: none;
}

button {
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #000;
  font-weight: 700;
  padding: 1rem;
  border-radius: 50px;
  border: none;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255,204,0,0.6);
}

.attendee {
  padding: 0.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* Main container */
.slider {
    width: 100%;
    max-width: 1100px;
    height: 500px;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Each row */
.row {
    display: flex;
    gap: 10px;
    width: max-content;
}

/* Slides */
.slide {
    width: 200px;
    height: 150px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
}

.slide:hover img {
    transform: scale(1.1);
}

/* Animations */
@keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

@keyframes scroll-right {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(0); }
}

.row.left {
    animation: scroll-left 150s linear infinite;
}

.row.right {
    animation: scroll-right 150s linear infinite;
}

/* Mobile Responsive Styles */
@media (max-width: 768px) {
  .hero {
    padding: 1rem;
    min-height: 100vh;
  }
  
  .hero-content {
    max-width: 100%;
  }
  
  h1 {
    font-size: clamp(2rem, 8vw, 3rem);
    letter-spacing: 1px;
  }
  
  h2 {
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
  }
  
  .description {
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }

  .link {
    font-size: 0.7rem;
    margin-bottom: 1.5rem;
  }
  
  /* Mobile Countdown */
  .countdown {
    gap: 0.5rem;
    margin: 1.5rem 0;
  }
  
  .time-box {
    min-width: 70px;
    padding: 0.75rem 0.5rem;
  }
  
  .time-box span {
    font-size: 1.5rem;
  }
  
  .time-box:not(:last-child)::after {
    content: "";
    font-size: 0.8rem;
    display: block;
    margin-top: 0.25rem;
  }
  
  /* Mobile Event Details */
  .event-details {
    padding: 1.5rem;
    margin-top: 1.5rem;
  }
  
  .event-details h3 {
    font-size: 1.1rem;
  }
  
  /* Mobile Map */
  .map-container {
    margin: 2rem auto;
    max-width: 100%;
  }
  
  iframe {
    height: 250px;
  }
  
  /* Mobile RSVP Section */
  .rsvp-section {
    margin: 2rem auto;
    padding: 1.5rem;
    max-width: 100%;
  }
  
  .rsvp-section h2 {
    font-size: 1.2rem;
  }
  
  input {
    padding: 0.875rem;
    font-size: 16px; /* Prevents zoom on iOS */
  }
  
  button {
    padding: 0.875rem;
    font-size: 16px;
  }
  
  /* Mobile Image Slider */
  .slider {
    height: 300px;
    margin-bottom: 2rem;
  }
  
  .slide {
    width: 120px;
    height: 90px;
  }
  
  .row {
    gap: 8px;
  }
  
  .row.left {
    animation: scroll-left 150s linear infinite;
  }
  
  .row.right {
    animation: scroll-right 150s linear infinite;
  }
}

/* Small Mobile (iPhone SE, etc.) */
@media (max-width: 480px) {
  .hero {
    padding: 0.75rem;
  }
  
  h1 {
    font-size: clamp(1.5rem, 10vw, 2.5rem);
  }
  
  h2 {
    font-size: 1rem;
  }
  
  .description {
    font-size: 0.85rem;
  }

  .link {
    font-size: 0.65rem;
  }
  
  .countdown {
    gap: 0.25rem;
  }
  
  .time-box {
    min-width: 60px;
    padding: 0.5rem 0.25rem;
  }
  
  .time-box span {
    font-size: 1.2rem;
  }
  
  .event-details {
    padding: 1rem;
  }
  
  .map-container {
    margin: 1.5rem auto;
  }
  
  iframe {
    height: 200px;
  }
  
  .rsvp-section {
    margin: 1.5rem auto;
    padding: 1rem;
  }
  
  .rsvp-section h2 {
    font-size: 1.1rem;
  }
  
  .rsvp-section h3 {
    font-size: 1rem;
  }
  
  /* Ultra-small slider */
  .slider {
    height: 250px;
  }
  
  .slide {
    width: 100px;
    height: 75px;
  }
  
  .row {
    gap: 6px;
  }
}

/* App-like optimizations for mobile browsers */
@media (max-width: 768px) and (orientation: portrait) {
  /* Prevent horizontal scroll */
  body {
    overflow-x: hidden;
  }
  
  /* Better touch targets */
  button, input {
    min-height: 44px; /* iOS touch target recommendation */
  }
  
  /* Optimize for mobile performance */
  .slide img {
    transform: translateZ(0); /* Hardware acceleration */
    backface-visibility: hidden;
  }
}

/* Landscape mobile optimizations */
@media (max-width: 768px) and (orientation: landscape) {
  .hero {
    min-height: auto;
    padding: 1rem;
  }
  
  .slider {
    height: 200px;
  }
  
  .countdown {
    margin: 1rem 0;
  }
  
  .event-details {
    margin-top: 1rem;
  }
}

/* Tablet optimizations */
@media (min-width: 769px) and (max-width: 1024px) {
  .hero-content {
    max-width: 95%;
  }
  
  .slider {
    height: 400px;
  }
  
  .slide {
    width: 160px;
    height: 120px;
  }
}

/* High DPI displays */
@media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
  .slide img {
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
  }
}

/* Dark mode support for mobile browsers */
@media (prefers-color-scheme: dark) {
  /* Already dark, but ensure consistency */
  body {
    background: radial-gradient(circle at top, #1a1a1a, #000000 80%);
  }
}

</style>
</head>

<section class="hero">
  <div class="hero-content">
    <div class="slider" id="slider"></div>
    <p class="link">You can get the photos <a href="https://web.facebook.com/media/set/?set=a.462705927074670&type=3&rdid=Fcnn5z4qvkG3Zyp7&share_url=https%3A%2F%2Fweb.facebook.com%2Fshare%2F1BzAVsh1RU%2F%3F_rdc%3D1%26_rdr#">here</a></p>
    <h1>IV-GENEROUS</h1>
    <h2>20 YEAR CLASS REUNION</h2>

    <p class="description">
      Celebrate 20 years of memories, friendship, and milestones.
    </p>

    <div class="event-details">
      <h3>MAY 16, 2026 | 12:00 NN</h3>
      <p>Nina's Restaurant</p>
      <div class="countdown">
        <div class="time-box"><span id="days"></span>Days</div>
        <div class="time-box"><span id="hours"></span>Hours</div>
        <div class="time-box"><span id="minutes"></span>Minutes</div>
        <div class="time-box"><span id="seconds"></span>Seconds</div>
      </div>
      <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3855.753328360998!2d120.8966104758589!3d14.895065385626948!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397ab34545be33b%3A0x290be937fcaae859!2sNina&#39;s%20Fried%20Itik%20And%20Restaurant!5e0!3m2!1sen!2sph!4v1776230462633!5m2!1sen!2sph" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

    </div>
    <div class="rsvp-section">
        <h2>Are you coming? We’d love to see you! Let us know</h2>
        <!-- <p style="opacity:0.7; margin-bottom:1rem;">Limited seats available.</p> -->
      
        <input type="text" id="name" placeholder="Enter your full name">
        <button onclick="addAttendee()">Confirm</button>
      
        <h3 style="margin-top:1rem;">Attendees:</h3>
        <div id="attendeeList"></div>
      </div>
  </div>
</section>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA9Z3TmvbviXlqF4bq5HTezi-vyio9XM-o",
  authDomain: "rsvp-web-app-ivgen.firebaseapp.com",
  databaseURL: "https://rsvp-web-app-ivgen-default-rtdb.asia-southeast1.firebasedatabase.app/",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("attendees");

function addAttendee(){
  const name = document.getElementById('name').value.trim();
  if(!name) return;
  db.push({name});
  document.getElementById('name').value="";
}

db.on("value", snapshot=>{
  const list=document.getElementById('attendeeList');
  list.innerHTML="";
  snapshot.forEach(child=>{
    const div=document.createElement('div');
    div.className="attendee";
    div.textContent=child.val().name;
    list.appendChild(div);
  });
});

const eventDate=new Date("May 16, 2026 12:00:00").getTime();
setInterval(()=>{
  const d=eventDate-new Date().getTime();
  document.getElementById('days').innerText=Math.floor(d/(1000*60*60*24));
  document.getElementById('hours').innerText=Math.floor((d%(1000*60*60*24))/(1000*60*60));
  document.getElementById('minutes').innerText=Math.floor((d%(1000*60*60))/(1000*60));
  document.getElementById('seconds').innerText=Math.floor((d%(1000*60))/1000);
},1000);

// Shuffle helper
function shuffle(arr) {
    return arr.sort(() => Math.random() - 0.5);
}

const slider = document.getElementById("slider");
const numberOfRows = 3;

for (let i = 0; i < numberOfRows; i++) {
    const row = document.createElement("div");
    row.classList.add("row");

    // Alternate direction
    row.classList.add(i % 2 === 0 ? "left" : "right");

    // Duplicate images for seamless loop
    const images = shuffle([...imageUrls, ...imageUrls]);

    images.forEach(url => {
        const slide = document.createElement("div");
        slide.className = "slide";
        slide.innerHTML = `<img src="${url}" />`;
        row.appendChild(slide);
    });

    slider.appendChild(row);
}
